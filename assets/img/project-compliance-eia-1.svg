<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t">
  <title id="t">Illustration: environmental impact assessment — field sampling of water and air beside a report and permit checklist</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E6F2F5"/><stop offset="1" stop-color="#EAF6EF"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7FC3D6"/><stop offset="1" stop-color="#3C8DBC"/></linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7BC47F"/><stop offset="1" stop-color="#2E8B57"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1F5E3B" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <!-- sun & clouds -->
  <circle cx="1350" cy="170" r="70" fill="#F4D58D"/>
  <g fill="#fff" opacity=".9"><ellipse cx="300" cy="150" rx="110" ry="34"/><ellipse cx="370" cy="130" rx="70" ry="40"/><ellipse cx="1120" cy="230" rx="90" ry="28"/></g>
  <!-- hills -->
  <path d="M0 640 C 200 520 380 560 560 600 S 900 520 1100 560 S 1450 600 1600 540 V1000 H0Z" fill="url(#hill)" opacity=".55"/>
  <path d="M0 700 C 260 640 520 690 760 680 S 1260 620 1600 680 V1000 H0Z" fill="#2E8B57" opacity=".75"/>
  <!-- factory -->
  <g transform="translate(1040 430)">
    <rect x="0" y="120" width="300" height="150" rx="8" fill="#F7FBF8" stroke="#1F5E3B" stroke-width="6"/>
    <path d="M0 120 L80 70 L80 120 L160 70 L160 120 L240 70 L240 120" fill="#DDEEE3" stroke="#1F5E3B" stroke-width="6" stroke-linejoin="round"/>
    <rect x="250" y="-20" width="34" height="140" fill="#F7FBF8" stroke="#1F5E3B" stroke-width="6"/>
    <g fill="#fff" stroke="#9FB8A8" stroke-width="4"><circle cx="270" cy="-60" r="26"/><circle cx="305" cy="-95" r="20"/><circle cx="335" cy="-125" r="14"/></g>
    <g fill="#9ED0E0"><rect x="30" y="160" width="50" height="40" rx="6"/><rect x="110" y="160" width="50" height="40" rx="6"/><rect x="190" y="160" width="50" height="40" rx="6"/></g>
    <!-- air sensor -->
    <g transform="translate(-110 40)">
      <line x1="40" y1="0" x2="40" y2="230" stroke="#1F5E3B" stroke-width="6"/>
      <rect x="10" y="-10" width="60" height="44" rx="8" fill="#D4A537" stroke="#1F5E3B" stroke-width="5"/>
      <path d="M85 0 q18 12 0 24 M100 -10 q30 22 0 44" fill="none" stroke="#2E8B57" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
  <!-- river -->
  <path d="M520 1000 C 600 880 760 860 860 800 S 1080 720 1240 720 L1600 720 V760 C 1300 760 1150 800 1000 860 S 760 960 720 1000Z" fill="url(#water)"/>
  <g stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".7" fill="none"><path d="M760 920 q30 -10 60 0"/><path d="M1000 830 q30 -10 60 0"/><path d="M1300 745 q30 -8 60 0"/></g>
  <!-- trees -->
  <g><rect x="196" y="600" width="14" height="70" fill="#5B4636"/><circle cx="203" cy="580" r="48" fill="#2E8B57"/><circle cx="175" cy="600" r="32" fill="#7BC47F"/></g>
  <g><rect x="930" y="600" width="12" height="60" fill="#5B4636"/><circle cx="936" cy="585" r="40" fill="#7BC47F"/></g>
  <!-- sampling bottle & magnifier -->
  <g transform="translate(860 760)" filter="url(#sh)">
    <rect x="-34" y="-110" width="68" height="120" rx="14" fill="#fff" stroke="#1F5E3B" stroke-width="6"/>
    <rect x="-22" y="-140" width="44" height="34" rx="6" fill="#1F5E3B"/>
    <rect x="-34" y="-50" width="68" height="60" rx="0" fill="#9ED0E0" opacity=".9"/>
    <rect x="-26" y="-92" width="52" height="22" rx="4" fill="#EAF6EF"/>
  </g>
  <!-- report clipboard -->
  <g transform="translate(150 230)" filter="url(#sh)">
    <rect x="0" y="0" width="430" height="560" rx="28" fill="#fff" stroke="#1F5E3B" stroke-width="6"/>
    <rect x="135" y="-28" width="160" height="58" rx="16" fill="#1F5E3B"/>
    <text x="40" y="96" font-family="Lora, Georgia, serif" font-weight="700" font-size="38" fill="#1F5E3B">EIA Report</text>
    <rect x="40" y="118" width="190" height="10" rx="5" fill="#D8E8DE"/>
    <g font-family="Be Vietnam Pro, Arial, sans-serif" font-size="27" fill="#1B2A22">
      <g transform="translate(40 180)"><rect width="38" height="38" rx="9" fill="#EAF6EF" stroke="#2E8B57" stroke-width="4"/><path d="M9 19 l7 8 l14 -16" stroke="#2E8B57" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="29">Water quality</text></g>
      <g transform="translate(40 250)"><rect width="38" height="38" rx="9" fill="#EAF6EF" stroke="#2E8B57" stroke-width="4"/><path d="M9 19 l7 8 l14 -16" stroke="#2E8B57" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="29">Air quality</text></g>
      <g transform="translate(40 320)"><rect width="38" height="38" rx="9" fill="#EAF6EF" stroke="#2E8B57" stroke-width="4"/><path d="M9 19 l7 8 l14 -16" stroke="#2E8B57" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="29">Field survey</text></g>
      <g transform="translate(40 390)"><rect width="38" height="38" rx="9" fill="#EAF6EF" stroke="#2E8B57" stroke-width="4"/><path d="M9 19 l7 8 l14 -16" stroke="#2E8B57" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="29">Discharge permit</text></g>
    </g>
    <!-- mini bar chart -->
    <g transform="translate(250 455)"><rect x="0" y="40" width="26" height="40" rx="5" fill="#7BC47F"/><rect x="40" y="15" width="26" height="65" rx="5" fill="#2E8B57"/><rect x="80" y="0" width="26" height="80" rx="5" fill="#D4A537"/><rect x="120" y="28" width="26" height="52" rx="5" fill="#3C8DBC"/></g>
    <!-- leaf seal -->
    <g transform="translate(80 500)"><circle r="44" fill="#FBF3DF" stroke="#D4A537" stroke-width="5"/><path d="M-4 22 a24 24 0 0 1 -4 -42 c18 -4 22 -6 28 -14 c3 7 6 14 6 26 c0 18 -14 30 -30 30z" fill="#2E8B57"/></g>
  </g>
  <!-- magnifier over river -->
  <g transform="translate(1180 780)" filter="url(#sh)">
    <circle r="78" fill="#fff" fill-opacity=".35" stroke="#1F5E3B" stroke-width="12"/>
    <line x1="56" y1="56" x2="130" y2="130" stroke="#1F5E3B" stroke-width="22" stroke-linecap="round"/>
    <g fill="#2E8B57"><circle cx="-24" cy="-10" r="9"/><circle cx="12" cy="-26" r="7"/><circle cx="18" cy="16" r="10"/></g>
  </g>
</svg>
